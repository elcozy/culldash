<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1013px" preserveAspectRatio="none" style="width:564px;height:1013px;background:#FFFFFF;" version="1.1" viewBox="0 0 564 1013" width="564px" zoomAndPan="magnify"><title>Exact duplicates: three passes, each narrower than the last</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="423.8486" x="68.7256" y="33.5352">Exact duplicates: three passes, each narrower than the last</text></g><ellipse cx="140.4492" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="162.5117" x="59.1934" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.5117" x="69.1934" y="109.0898">every photo in the shoot</text><path d="M227.9648,131.6211 L227.9648,170.8975 L207.9648,174.8975 L227.9648,178.8975 L227.9648,218.1738 A0,0 0 0 0 227.9648,218.1738 L513.0972,218.1738 A0,0 0 0 0 513.0972,218.1738 L513.0972,141.6211 L503.0972,131.6211 L227.9648,131.6211 A0,0 0 0 0 227.9648,131.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M503.0972,131.6211 L503.0972,141.6211 L513.0972,141.6211 L503.0972,131.6211" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2065" x="233.9648" y="149.1895">Free: the length came with the folder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.3638" x="233.9648" y="164.5">listing. Also a weaker filter than it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.1323" x="233.9648" y="179.8105">sounds &#8212; a camera writes RAWs of nearly</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.2603" x="233.9648" y="195.1211">fixed length, and 1,799 of one card's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7471" x="233.9648" y="210.4316">2,645 frames shared a length.</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.0313" x="72.9336" y="157.8311"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.0313" x="82.9336" y="179.4326">group by file length</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="98.1699" x="91.3643" y="286.6514"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.1699" x="101.3643" y="308.2529">no duplicates</text><ellipse cx="140.4492" cy="360.2178" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="140.4492" cy="360.2178" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="66.9082,238.1738,213.9902,238.1738,225.9902,250.1738,213.9902,262.1738,66.9082,262.1738,54.9082,250.1738,66.9082,238.1738" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="144.4492" y="272.8086">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.082" x="66.9082" y="254.3311">any group bigger than one?</text><path d="M285.7471,403.2178 L285.7471,434.8389 L265.7471,438.8389 L285.7471,442.8389 L285.7471,474.46 A0,0 0 0 0 285.7471,474.46 L543.8193,474.46 A0,0 0 0 0 543.8193,474.46 L543.8193,413.2178 L533.8193,403.2178 L285.7471,403.2178 A0,0 0 0 0 285.7471,403.2178" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M533.8193,403.2178 L533.8193,413.2178 L543.8193,413.2178 L533.8193,403.2178" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0723" x="291.7471" y="420.7861">Two different frames differ within the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2642" x="291.7471" y="436.0967">first few KB of pixel data, so this</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.3359" x="291.7471" y="451.4072">separates them for a thousandth of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.2544" x="291.7471" y="466.7178">the reading.</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.5957" x="15.1514" y="421.7725"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.5957" x="25.1514" y="443.374">read 64 KB from each end of those files</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="98.1699" x="91.3643" y="542.9375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.1699" x="101.3643" y="564.5391">no duplicates</text><ellipse cx="140.4492" cy="616.5039" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="140.4492" cy="616.5039" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="55.5376,494.46,225.3608,494.46,237.3608,506.46,225.3608,518.46,55.5376,518.46,43.5376,506.46,55.5376,494.46" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.5835" x="144.4492" y="529.0947">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="169.8232" x="55.5376" y="510.6172">any group still bigger than one?</text><path d="M289.8984,659.5039 L289.8984,683.4697 L269.8984,687.4697 L289.8984,691.4697 L289.8984,715.4355 A0,0 0 0 0 289.8984,715.4355 L552.2998,715.4355 A0,0 0 0 0 552.2998,715.4355 L552.2998,669.5039 L542.2998,659.5039 L289.8984,659.5039 A0,0 0 0 0 289.8984,659.5039" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M542.2998,659.5039 L542.2998,669.5039 L552.2998,669.5039 L542.2998,659.5039" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0225" x="295.8984" y="677.0723">Only real copies get this far. Reading</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.7148" x="295.8984" y="692.3828">them in full is the price of promising</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4014" x="295.8984" y="707.6934">that deleting the extras loses nothing.</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.8984" x="11" y="670.4033"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.8984" x="21" y="692.0049">read those files whole, through SHA-256</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.6953" x="37.6016" y="735.4355"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.6953" x="47.6016" y="757.0371">groups of byte-identical photos</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.916" x="52.9912" y="789.5684"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.916" x="62.9912" y="811.1699">the shoot narrows to them</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.4941" x="18.7021" y="843.7012"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.4824" x="28.7021" y="865.3027">"Keep one of each" rejects every copy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.4941" x="28.7021" y="879.4355">but one &#8212; a picked copy is the keeper</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.2012" x="18.8486" y="911.9668"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.2012" x="28.8486" y="933.5684">the Trash button takes them together,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.2129" x="28.8486" y="947.7012">and Cmd-Z brings them back</text><ellipse cx="140.4492" cy="991.2324" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="140.4492" cy="991.2324" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="136.4492,77.4883,140.4492,87.4883,144.4492,77.4883,140.4492,81.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="121.6211" y2="157.8311"/><polygon fill="#181818" points="136.4492,147.8311,140.4492,157.8311,144.4492,147.8311,140.4492,151.8311" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="320.7842" y2="349.2178"/><polygon fill="#181818" points="136.4492,339.2178,140.4492,349.2178,144.4492,339.2178,140.4492,343.2178" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="262.1738" y2="286.6514"/><polygon fill="#181818" points="136.4492,276.6514,140.4492,286.6514,144.4492,276.6514,140.4492,280.6514" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.9902" x2="237.9902" y1="250.1738" y2="250.1738"/><polygon fill="#181818" points="233.9902,319.2178,237.9902,329.2178,241.9902,319.2178,237.9902,323.2178" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="237.9902" x2="237.9902" y1="250.1738" y2="393.2178"/><line style="stroke:#181818;stroke-width:1;" x1="237.9902" x2="140.4492" y1="393.2178" y2="393.2178"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="393.2178" y2="421.7725"/><polygon fill="#181818" points="136.4492,411.7725,140.4492,421.7725,144.4492,411.7725,140.4492,415.7725" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="191.9639" y2="238.1738"/><polygon fill="#181818" points="136.4492,228.1738,140.4492,238.1738,144.4492,228.1738,140.4492,232.1738" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="577.0703" y2="605.5039"/><polygon fill="#181818" points="136.4492,595.5039,140.4492,605.5039,144.4492,595.5039,140.4492,599.5039" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="140.4492" x2="140.4492" y1="518.46" y2="542.9375"/><polygon fill="#181818" points="136.4492,532.9375,140.4492,542.9375,144.4492,532.9375,140.4492,536.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="237.3608" x2="249.3608" y1="506.46" y2="506.46"/><polygon fill="#181818" points="245.3608,575.5039,249.3608,585.5039,253.3608,575.5039,249.3608,579.5039" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="249.3608" x2="249.36